[project]
name = "keras-image-classifier"
version = "1.0.2"
description = "Reproducible image-classification pipeline with Keras 3: prepare, split, train, evaluate, predict."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tudor Andrian" }]
requires-python = ">=3.12,<3.15"
keywords = ["keras", "jax", "image-classification", "computer-vision", "reproducibility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # Keras 3 is backend-agnostic. JAX is the default backend here because its CPU
    # wheels are about 70 MB on every platform; TensorFlow would add about 1.5 GB.
    "jax>=0.11,<0.12",
    "keras>=3.15,<4",
    "matplotlib>=3.10,<4",
    "numpy>=2.1,<3",
    "pillow>=11.3,<13",
]

[project.scripts]
kic = "keras_image_classifier.cli:main"

[project.urls]
Repository = "https://github.com/tudorandrian/keras-image-classifier"
Changelog = "https://github.com/tudorandrian/keras-image-classifier/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keras_image_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: asks Zenodo whether the EuroSAT archive still has the pinned size (opt in with -m network)",
]
filterwarnings = [
    "error",
    # Keras 3.15 converts its variables with np.array(variable), which NumPy 2.5 deprecates.
    # Upstream code, harmless here; remove the line when a Keras release fixes it.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.coverage.run]
source = ["keras_image_classifier"]
branch = true
omit = ["src/keras_image_classifier/__main__.py"]  # exercised through a subprocess

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PTH", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S310", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/keras_image_classifier"]

[[tool.mypy.overrides]]
# Keras and matplotlib are treated as untyped so the result does not depend on
# which versions happen to ship stubs.
module = ["keras.*", "matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"
